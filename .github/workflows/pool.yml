# This workflow guards the shared bot pool.
#
# Two rules, both about keeping 25 concurrent pull requests from tripping over
# each other:
#
#   1. A pull request may only touch its author's own bot folder.
#   2. Everything in the repo must still compile.
#
# Rule 1 is what makes the pool conflict-free. If everyone only ever edits
# `src/main/java/bots/<their-username>/`, no two pull requests can ever change the
# same line, so nobody has to resolve a merge conflict to publish a bot.
name: pool

on:
  pull_request:
    branches: [main]

jobs:
  own-folder-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only your own bot folder may change
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "Files changed:"
          echo "$changed" | sed 's/^/  /'
          echo

          # GitHub usernames may contain hyphens; Java package names may not, so the
          # folder keeps the hyphen and only the package line swaps it for underscore.
          mine="src/main/java/bots/$(echo "$AUTHOR" | tr '[:upper:]' '[:lower:]')/"
          bad=$(echo "$changed" | grep '^src/main/java/bots/' | grep -v "^$mine" || true)

          if [ -n "$bad" ]; then
            echo "::error::A pull request may only change files in its author's own bot folder."
            echo "You are @$AUTHOR, so your folder is: $mine"
            echo
            echo "These files belong to someone else:"
            echo "$bad" | sed 's/^/  /'
            echo
            echo "Move your bot into $mine and drop the other changes."
            exit 1
          fi

          echo "OK — only $mine was touched."

  compiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiles every bot in the pool and runs the arena's unit tests. A bot that
      # does not compile is caught here, before it reaches anyone else's checkout.
      - name: Compile every bot
        run: ./mvnw -B test
